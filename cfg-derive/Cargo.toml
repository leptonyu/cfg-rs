[package]
authors = ['Daniel Yu <leptonyu@gmail.com>']
categories = ['config']
description = 'A rust configuration loader'
documentation = 'https://docs.rs/cfg-derive/'
edition = "2018"
homepage = 'https://github.com/leptonyu/cfg-rs'
keywords = ['configuration', 'config', 'settings', 'env', 'environment']
license = 'MIT'
name = "cfg-derive"
readme = 'README.md'
repository = 'https://github.com/leptonyu/cfg-rs'
version = "1.0.1"

[lib]
proc-macro = true

[features]
regex = ["dep:regex"]

[dependencies]
quote = '1.0.47'
syn = { version = '3.0.7', features = ['extra-traits'] }
regex = { version = "1.13.1", optional = true }

