[package]
authors = ['Daniel Yu <leptonyu@gmail.com>']
categories = ['config']
description = 'A rust configuration loader'
documentation = 'https://docs.rs/cfg-rs/'
edition = "2024"
homepage = 'https://github.com/leptonyu/cfg-rs'
keywords = ['configuration', 'config', 'settings', 'env', 'environment']
license = 'MIT'
name = "cfg-rs"
readme = 'README.md'
repository = 'https://github.com/leptonyu/cfg-rs'
rust-version = "1.85.0"
version = "1.0.6"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ['--cfg', 'docsrs']

[package.metadata.playground]
all-features = true

[workspace]
members = ['.', 'cfg-derive']

[features]
default = []
full = ["toml", "yaml", "json", "rand", "ini", "log", "coarsetime", "regex"]
ini = ["dep:rust-ini"]
rand = ["dep:rand"]
yaml = ["dep:yaml-rust2"]
toml = ["dep:toml"]
json = ["dep:serde_json"]
log = ["dep:log"]
coarsetime = ["dep:coarsetime"]
regex = ["dep:regex", "cfg-derive/regex"]

[dependencies]
cfg-derive = { path = './cfg-derive', version = '^1.0.1' }
serde_json = { version = "1.0.151", optional = true }
log = { version = "0.4.34", optional = true }
rand = { version = "0.10.3", optional = true }
rust-ini = { version = "0.21.3", optional = true }
toml = { version = "1.1.8", optional = true }
yaml-rust2 = { version = "0.13.0", optional = true, default-features = false }
coarsetime = { version = "0.1.38", optional = true }
regex = { version = "1.13.1", optional = true }

[dev-dependencies]
env_logger = "0.11.11"
divan = '0.1.21'
clap = '4.6.7'
regex = '1.13.1'
log = '0.4.34'
quickcheck = '1.1.0'
quickcheck_macros = '1.2.0'

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[[example]]
name = "thread_pool"
[[example]]
name = "salak"
[[example]]
name = "test_suit"
[[example]]
name = "logger"
required-features = ["full"]
[[example]]
name = "refresh"
[[example]]
name = "watch"
required-features = ["yaml"]
[[example]]
name = "profile"
required-features = ["toml"]
[[example]]
name = "simple"
required-features = ["full"]
[[example]]
name = "validate"
required-features = ["regex"]
[[bench]]
harness = false
name = "core"
